[package]
name = "lectio"
version = "0.1.0"
edition = "2024"
description = "Searches the given bible readings for a specific date"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.39", features = ["derive"] }
colored = "3.0.0"
inquire = "0.7.5"
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
textwrap = "0.16.2"
