[package]
name = "lectio"
version = "0.1.1"
edition = "2024"
description = "Searches the given bible readings for a specific date"
license = "MIT"
repository = "https://github.com/Ryanssd22/lectio"
homepage = "https://github.com/Ryanssd22/lectio"
keywords = ["cli", "bible", "reading"]
categories = ["command-line-utilities"]
authors = ["Ryan Simeon benedictrsimeon@gmail.com"]

[lib]
name = "lectio_wasm"
path = "src/wasm.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["full", "macros"] }
anyhow = "1.0.98"
chrono = "0.4.41"
clap = { version = "4.5.39", features = ["derive"] }
colored = "3.0.0"
inquire = "0.7.5"
once_cell = "1.21.3"
owo-colors = "4.2.1"
regex = "1.11.1"
reqwest = "0.12.20"
scraper = "0.23.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
textwrap = "0.16.2"
futures = "0.3"
dirs = "6.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = "0.4.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21.3"
dirs = "6.0.0"

[dependencies]
wasm-bindgen = "0.2.100"
